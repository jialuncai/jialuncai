<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Ma Zhiyong — Personal Agent frameworks and everyday applications">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141b26"/>
      <stop offset="1" stop-color="#1d2635"/>
    </linearGradient>
    <style>
      .name { font: 700 44px 'SF Mono','Cascadia Code',Consolas,monospace; fill:#f3ede2; }
      .caret { fill:#e8804a; animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity:0; } }
      .type { clip-path: inset(0 100% 0 0); animation: reveal 2.4s steps(11) 0.3s forwards; }
      @keyframes reveal { to { clip-path: inset(0 0 0 0); } }
      .sub { font: 500 15px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill:#93a3b8; }
      .role { font: 600 15px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill:#d8cbb4; opacity:0; animation: cycle 9s infinite; }
      .role.r2 { animation-delay: 3s; } .role.r3 { animation-delay: 6s; }
      @keyframes cycle { 0%,4% {opacity:0} 8%,28% {opacity:1} 33%,100% {opacity:0} }
      .lane { fill:none; stroke-width:2.2; stroke-linecap:round; stroke-dasharray:6 9; animation: flow 2.8s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -30; } }
      .hand { transform-origin: 700px 140px; animation: sweep 24s linear infinite; }
      @keyframes sweep { to { transform: rotate(360deg); } }
      .tick { stroke:#3a4a61; stroke-width:1.6; }
      .tick.major { stroke:#5d718c; stroke-width:2.4; }
      .cell { opacity:0; animation: cellin 0.5s ease-out forwards; }
      @keyframes cellin { to { opacity:1; } }
      .gate { animation: gatepulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes gatepulse { 50% { transform: scale(1.12); } }
      .cap { font: 500 12px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill:#6e8098; }
      .glyph { font: 600 11px 'Segoe UI',sans-serif; }
    </style>
  </defs>

  <rect width="900" height="280" rx="14" fill="url(#bg)"/>

  <!-- left: identity -->
  <text class="sub" x="48" y="52">浙江大学 · Zhejiang University</text>
  <g class="type"><text class="name" x="48" y="116">Ma Zhiyong</text></g>
  <rect class="caret" x="352" y="82" width="3" height="40"/>
  <text class="role" x="48" y="150">Personal Agent 框架 × 生活应用</text>
  <text class="role r2" x="48" y="150">策略引擎 · 审批流 · 字节级确定性重放</text>
  <text class="role r3" x="48" y="150">diurnix — 把每一天编织成可复现的日报</text>
  <text class="sub" x="48" y="192" style="fill:#5f7189">合成 persona 工厂 · 植入真值 · 全离线可复现</text>

  <g font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600">
    <rect x="48" y="220" width="74" height="24" rx="12" fill="#22303f" stroke="#3a4a61"/>
    <text x="85" y="236" fill="#f2b263" text-anchor="middle">Python</text>
    <rect x="130" y="220" width="74" height="24" rx="12" fill="#22303f" stroke="#3a4a61"/>
    <text x="167" y="236" fill="#8fb996" text-anchor="middle">NumPy</text>
    <rect x="212" y="220" width="94" height="24" rx="12" fill="#22303f" stroke="#3a4a61"/>
    <text x="259" y="236" fill="#e8804a" text-anchor="middle">PyTorch·CPU</text>
    <rect x="314" y="220" width="102" height="24" rx="12" fill="#22303f" stroke="#3a4a61"/>
    <text x="365" y="236" fill="#7ea6c9" text-anchor="middle">offline-first</text>
  </g>

  <!-- right: day dial — four life streams through a policy gate into the dial, digests out -->
  <g>
    <!-- dial ring + 24 ticks -->
    <circle cx="700" cy="140" r="86" fill="none" stroke="#2a384a" stroke-width="2"/>
    <circle cx="700" cy="140" r="70" fill="none" stroke="#22303f" stroke-width="1"/>
    <g>
      <line class="tick major" x1="700" y1="48" x2="700" y2="58"/>
      <line class="tick major" x1="792" y1="140" x2="782" y2="140"/>
      <line class="tick major" x1="700" y1="232" x2="700" y2="222"/>
      <line class="tick major" x1="608" y1="140" x2="618" y2="140"/>
      <line class="tick" x1="746" y1="55" x2="742" y2="64"/>
      <line class="tick" x1="777" y1="94" x2="768" y2="98"/>
      <line class="tick" x1="777" y1="186" x2="768" y2="182"/>
      <line class="tick" x1="746" y1="225" x2="742" y2="216"/>
      <line class="tick" x1="654" y1="225" x2="658" y2="216"/>
      <line class="tick" x1="623" y1="186" x2="632" y2="182"/>
      <line class="tick" x1="623" y1="94" x2="632" y2="98"/>
      <line class="tick" x1="654" y1="55" x2="658" y2="64"/>
    </g>
    <!-- day cells lighting sequentially inside the ring -->
    <g>
      <rect class="cell" x="668" y="96" width="18" height="10" rx="5" fill="#e8804a" style="animation-delay:1.4s"/>
      <rect class="cell" x="692" y="96" width="30" height="10" rx="5" fill="#7ea6c9" style="animation-delay:1.7s"/>
      <rect class="cell" x="660" y="112" width="26" height="10" rx="5" fill="#8fb996" style="animation-delay:2.0s"/>
      <rect class="cell" x="692" y="112" width="22" height="10" rx="5" fill="#f2b263" style="animation-delay:2.3s"/>
      <rect class="cell" x="720" y="112" width="18" height="10" rx="5" fill="#e8804a" style="animation-delay:2.6s"/>
      <rect class="cell" x="672" y="128" width="34" height="10" rx="5" fill="#7ea6c9" style="animation-delay:2.9s"/>
      <rect class="cell" x="712" y="128" width="20" height="10" rx="5" fill="#8fb996" style="animation-delay:3.2s"/>
      <rect class="cell" x="664" y="144" width="20" height="10" rx="5" fill="#f2b263" style="animation-delay:3.5s"/>
      <rect class="cell" x="690" y="144" width="40" height="10" rx="5" fill="#e8804a" style="animation-delay:3.8s"/>
      <rect class="cell" x="678" y="160" width="26" height="10" rx="5" fill="#8fb996" style="animation-delay:4.1s"/>
      <rect class="cell" x="710" y="160" width="18" height="10" rx="5" fill="#7ea6c9" style="animation-delay:4.4s"/>
    </g>
    <!-- sweep hand -->
    <g class="hand"><line x1="700" y1="140" x2="700" y2="72" stroke="#f3ede2" stroke-width="2" stroke-linecap="round" opacity="0.75"/><circle cx="700" cy="140" r="4" fill="#f3ede2"/></g>

    <!-- four input lanes with glyphs -->
    <path class="lane" stroke="#f2b263" d="M480,72 C 540,72 560,96 606,116"/>
    <path class="lane" stroke="#e8804a" d="M480,116 C 540,116 556,124 604,132" style="animation-delay:-0.7s"/>
    <path class="lane" stroke="#8fb996" d="M480,164 C 540,164 556,156 604,148" style="animation-delay:-1.4s"/>
    <path class="lane" stroke="#7ea6c9" d="M480,208 C 540,208 560,184 606,164" style="animation-delay:-2.1s"/>
    <g class="glyph" text-anchor="middle">
      <circle cx="468" cy="72" r="11" fill="#22303f" stroke="#f2b263" stroke-width="1.6"/><text x="468" y="76" fill="#f2b263">@</text>
      <circle cx="468" cy="116" r="11" fill="#22303f" stroke="#e8804a" stroke-width="1.6"/><rect x="462" y="110" width="12" height="11" rx="2" fill="none" stroke="#e8804a" stroke-width="1.6"/>
      <circle cx="468" cy="164" r="11" fill="#22303f" stroke="#8fb996" stroke-width="1.6"/><text x="468" y="168" fill="#8fb996">¥</text>
      <circle cx="468" cy="208" r="11" fill="#22303f" stroke="#7ea6c9" stroke-width="1.6"/><path d="M463,208 l4,4 l7,-8" stroke="#7ea6c9" stroke-width="2" fill="none"/>
    </g>
    <text class="cap" x="468" y="240" text-anchor="middle">inbox · calendar · ledger · habits</text>

    <!-- policy gate -->
    <g class="gate">
      <path d="M560,128 l14,-6 l14,6 v10 c0,10 -8,16 -14,19 c-6,-3 -14,-9 -14,-19 z" fill="#1d2635" stroke="#f3ede2" stroke-width="1.8"/>
      <path d="M568,141 l4,4 l8,-9" stroke="#8fb996" stroke-width="2.2" fill="none"/>
    </g>
    <text class="cap" x="574" y="176" text-anchor="middle">policy gate</text>

    <!-- digest cards out -->
    <g>
      <rect class="cell" x="812" y="196" width="52" height="14" rx="4" fill="#22303f" stroke="#3a4a61" style="animation-delay:4.7s"/>
      <rect class="cell" x="820" y="214" width="52" height="14" rx="4" fill="#22303f" stroke="#3a4a61" style="animation-delay:5.0s"/>
      <rect class="cell" x="828" y="232" width="52" height="14" rx="4" fill="#22303f" stroke="#e8804a" style="animation-delay:5.3s"/>
      <path class="lane" stroke="#e8804a" d="M762,196 C 790,204 800,208 812,214" style="animation-delay:-1s"/>
      <text class="cap" x="840" y="262" text-anchor="middle">daily digest</text>
    </g>
  </g>
</svg>
